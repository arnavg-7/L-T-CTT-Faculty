<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L&T CTT — Faculty Portal · Sign in</title>
<style>
  :root{--bg:#EEF1F7;--card:#fff;--soft:#F5F7FB;--primary:#1B7EC2;--primary-deep:#1273BC;--navy:#14285C;--ink:#212B38;--muted:#8A94A4;--faint:#B4BCCA;--line:#ECEFF5;--bad:#DE4B3E;
    --grad:linear-gradient(135deg,#2BA6DA 0%,#1273BC 100%);--font:"SF Pro Rounded","Segoe UI",system-ui,-apple-system,Arial,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .split{display:flex;min-height:100vh}
  /* left brand/scene pane */
  .pane-l{display:none;flex:1.05;position:relative;overflow:hidden;background:linear-gradient(180deg,#8FC7EE 0%,#5FA8E0 42%,#2E82C4 100%)}
  .pane-l .birds{position:absolute;top:12%;left:10%;color:#eaf4fd;opacity:.7}
  .pane-l .city{position:absolute;left:0;right:0;bottom:0;width:100%;display:block}
  .pane-l .cap{position:absolute;left:34px;bottom:30px;color:#fff}
  .pane-l .cap .t{font-weight:800;font-size:20px;letter-spacing:.3px;text-shadow:0 2px 12px rgba(0,40,80,.35)}
  .pane-l .cap .s{font-size:12px;opacity:.92;margin-top:4px}
  /* right form pane */
  .pane-r{flex:1;display:grid;place-items:center;padding:40px 24px}
  .loginbox{width:100%;max-width:380px}
  .head{text-align:center;margin-bottom:28px}
  .head .brand{font-weight:800;font-size:14px;color:var(--navy);letter-spacing:1px}
  .head h1{font-size:24px;font-weight:800;color:var(--navy);margin-top:10px;letter-spacing:-.3px}
  .head p{font-size:13px;color:var(--muted);margin-top:3px}
  label{display:block;font-size:12px;color:var(--ink);font-weight:600;margin-bottom:7px}
  label .req{color:var(--bad)}
  .ip{position:relative;margin-bottom:18px}
  .ip input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:14px;font-family:inherit}
  .ip input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(27,126,194,.12)}
  .ip .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:none;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .ip .eye svg{width:19px;height:19px}
  .forgot{text-align:right;margin:-8px 0 20px}
  .forgot a{color:var(--primary);font-size:12px;font-weight:600;text-decoration:none;cursor:pointer}
  .btn{width:100%;padding:13px;border:none;border-radius:11px;background:var(--grad);color:#fff;font-weight:600;font-size:14px;letter-spacing:.1px;font-family:inherit;cursor:pointer;box-shadow:0 6px 16px rgba(27,126,194,.28)}
  .btn:hover{filter:brightness(1.03)}
  .reg{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
  .reg a{color:var(--primary);font-weight:600;text-decoration:none}
  .note{text-align:center;color:var(--faint);font-size:10.5px;margin-top:14px}
  @media(min-width:900px){.pane-l{display:block}}
</style>
<div class="split">
  <div class="pane-l">
    <svg class="birds" width="120" height="40" viewBox="0 0 120 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 14c3-4 5-4 8 0 3-4 5-4 8 0"/><path d="M40 8c3-4 5-4 8 0 3-4 5-4 8 0"/><path d="M22 26c2-3 4-3 6 0 2-3 4-3 6 0"/>
    </svg>
    <svg class="city" viewBox="0 0 600 320" preserveAspectRatio="xMidYMax slice" fill="none">
      <g fill="#eef6fd" opacity="0.25"><rect x="30" y="180" width="60" height="140"/><rect x="510" y="200" width="60" height="120"/></g>
      <g fill="#ffffff" opacity="0.9">
        <path d="M210 320V96c0-30 30-46 90-46s90 16 90 46v224z"/>
      </g>
      <g fill="#cfe6f8"><rect x="228" y="120" width="8" height="180"/><rect x="248" y="120" width="8" height="180"/><rect x="268" y="120" width="8" height="180"/><rect x="288" y="120" width="8" height="180"/><rect x="308" y="120" width="8" height="180"/><rect x="328" y="120" width="8" height="180"/><rect x="348" y="120" width="8" height="180"/><rect x="368" y="120" width="8" height="180"/></g>
      <rect x="250" y="86" width="100" height="16" rx="4" fill="#14285C" opacity="0.85"/>
      <g fill="#dcedfb"><path d="M120 320V150c0-16 14-26 44-26s44 10 44 26v170z"/><path d="M392 320V160c0-16 14-24 42-24s42 8 42 24v160z"/></g>
      <path d="M0 300c60-16 120-16 180 0s120 20 220 4 140-14 200 6v10H0z" fill="#2E82C4" opacity="0.5"/>
    </svg>
    <div class="cap"><div class="t">Transforming Lives</div><div class="s">Through Skilling · L&amp;T CTT Campus</div></div>
  </div>

  <div class="pane-r">
    <div class="loginbox">
      <div class="head">
        <div class="brand">L&amp;T CTT</div>
        <h1>Sign in</h1>
        <p>Faculty Portal</p>
      </div>

      <form onsubmit="location.href='portal.html';return false;">
        <label>Username <span class="req">*</span></label>
        <div class="ip"><input type="text" placeholder="e.g. mateen.shaikh.6788" autocomplete="off"></div>
        <label>Password <span class="req">*</span></label>
        <div class="ip"><input type="password" id="pw" placeholder="Enter your password" autocomplete="off"><button class="eye" type="button" onclick="tog('pw',this)" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <div class="forgot"><a onclick="alert('Password reset is disabled in this prototype.')">Forgot password?</a></div>
        <button class="btn" type="submit">Login</button>
        <div class="note" style="margin-top:20px">Faculty access · Prototype — for demonstration only</div>
      </form>
    </div>
  </div>
</div>
<script>
  function tog(id,btn){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';btn.style.color=i.type==='text'?'var(--primary)':'var(--muted)';}
</script>
</html>
