<meta charset="utf-8">
<title>CTT Skilling LMS — Faculty Portal</title>
<style>
  :root{
    --bg:#EEF1F7; --card:#FFFFFF; --soft:#F5F7FB;
    --primary:#1B7EC2; --primary-deep:#1273BC;
    --grad:linear-gradient(135deg,#2BA6DA 0%,#1273BC 100%);
    --navy:#14285C;
    --ink:#212B38; --muted:#8A94A4; --faint:#B4BCCA;
    --line:#ECEFF5;
    --ok:#2E9E52; --ok-bg:#E8F5EC;
    --warn:#C4881A; --warn-bg:#FBF3DE;
    --bad:#DE4B3E; --bad-bg:#FBE9E7;
    --chip-sky:#E9F2FB; --chip-sky-i:#2380C4;
    --chip-green:#E8F5EC; --chip-green-i:#3AA35B;
    --chip-amber:#FBF3DE; --chip-amber-i:#CE9526;
    --chip-lav:#EDEBFA; --chip-lav-i:#6B5BD1;
    --shadow:0 1px 3px rgba(20,40,92,.05);
    --r:18px; --r-sm:13px;
    --fs-pg:20px; --fs-sec:15px; --fs-body:13px; --fs-meta:11.5px; --fs-num:23px;
    --font:"SF Pro Rounded","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#EEF1F7; --card:#FFFFFF; --soft:#F5F7FB; --primary:#1B7EC2; --primary-deep:#1273BC;
    --grad:linear-gradient(135deg,#2BA6DA 0%,#1273BC 100%); --navy:#14285C;
    --ink:#212B38; --muted:#8A94A4; --faint:#B4BCCA; --line:#ECEFF5;
    --ok:#2E9E52; --ok-bg:#E8F5EC; --warn:#C4881A; --warn-bg:#FBF3DE; --bad:#DE4B3E; --bad-bg:#FBE9E7;
    --chip-sky:#E9F2FB; --chip-sky-i:#2380C4; --chip-green:#E8F5EC; --chip-green-i:#3AA35B;
    --chip-amber:#FBF3DE; --chip-amber-i:#CE9526; --chip-lav:#EDEBFA; --chip-lav-i:#6B5BD1;
    --shadow:0 1px 3px rgba(20,40,92,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);
    font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit}
  svg{display:block}

  .app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}

  .sidebar{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 16px;position:sticky;top:0;height:100vh}
  .profile{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 26px}
  .avatar{width:88px;height:88px;border-radius:50%;padding:3px;box-shadow:0 0 0 2.5px var(--primary);margin-bottom:12px}
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .profile .nm{font-size:var(--fs-sec);font-weight:600}
  .profile .id{font-size:var(--fs-meta);color:var(--muted);margin-top:1px}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
  .nav a{display:flex;align-items:center;gap:13px;padding:10px 14px;border-radius:11px;color:var(--muted);font-weight:500;text-decoration:none;cursor:pointer;transition:.15s}
  .nav a svg{width:18px;height:18px;flex:none;transition:.15s}
  .nav a:hover{background:var(--soft);color:var(--ink)}
  .nav a.active{background:var(--grad);color:#fff;font-weight:600;box-shadow:0 5px 14px rgba(27,126,194,.3)}
  .nav .parent{display:flex;align-items:center;gap:13px;padding:10px 14px;border-radius:11px;color:var(--muted);font-weight:600;cursor:pointer;transition:.15s;margin-top:6px}
  .nav .parent:first-child{margin-top:0}
  .nav .parent:hover{background:var(--soft);color:var(--ink)}
  .nav .parent .pi{width:18px;height:18px;flex:none}
  .nav .parent .cv{margin-left:auto;width:16px;height:16px;color:var(--faint);transition:.2s}
  .nav .parent.open .cv{transform:rotate(180deg)}
  .nav .sub{display:none;flex-direction:column;gap:3px;margin:3px 0 4px}
  .nav .parent.open + .sub{display:flex}
  .nav .sub a{padding-left:32px}
  .logout{margin-top:auto;padding-top:12px}

  .main{padding:26px 30px 44px;min-width:0}
  .topbar{display:flex;gap:16px;align-items:center;margin-bottom:26px}
  .topbar h2{font-size:var(--fs-pg);font-weight:700;letter-spacing:-.3px}
  .topbar .crumb{font-size:var(--fs-meta);color:var(--muted);margin-top:2px}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:14px}
  .top-actions .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--card);box-shadow:var(--shadow);cursor:pointer}
  .top-actions .ico svg{width:18px;height:18px}
  .brand{display:flex;flex-direction:column;align-items:center;line-height:1.05}
  .brand .lt{font-weight:800;font-size:13px;color:var(--navy);letter-spacing:.4px}
  .brand .sub{font-size:8px;font-weight:600;letter-spacing:1.4px;color:var(--primary);margin-top:2px}

  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 26px}
  .grid{display:grid;gap:20px}
  .g2{grid-template-columns:1.4fr 1fr}
  .g2e{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}
  .head h3{font-size:var(--fs-sec);font-weight:600}
  .link{color:var(--primary);font-weight:600;font-size:var(--fs-meta);text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .link svg{width:14px;height:14px}
  .muted{color:var(--muted)}
  .lbl{font-size:var(--fs-meta);color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

  .chip{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
  .chip svg{width:20px;height:20px}
  .c-sky{background:var(--chip-sky);color:var(--chip-sky-i)}
  .c-green{background:var(--chip-green);color:var(--chip-green-i)}
  .c-amber{background:var(--chip-amber);color:var(--chip-amber-i)}
  .c-lav{background:var(--chip-lav);color:var(--chip-lav-i)}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:var(--fs-meta);font-weight:600;line-height:1.4}
  .pill svg{width:12px;height:12px}
  .p-ok{background:var(--ok-bg);color:var(--ok)}
  .p-warn{background:var(--warn-bg);color:var(--warn)}
  .p-bad{background:var(--bad-bg);color:var(--bad)}
  .p-neu{background:var(--soft);color:var(--muted)}
  .p-info{background:var(--chip-sky);color:var(--chip-sky-i)}
  .p-lav{background:var(--chip-lav);color:var(--chip-lav-i)}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;font-weight:600;font-size:var(--fs-body);transition:.15s}
  .btn svg{width:15px;height:15px}
  .btn-p{background:var(--grad);color:#fff;box-shadow:0 5px 14px rgba(27,126,194,.28)}
  .btn-o{border:1px solid var(--line);color:var(--muted)}
  .btn-o:hover{color:var(--primary);border-color:var(--primary)}
  .btn-sm{padding:7px 13px}
  .btn-d{background:var(--bad-bg);color:var(--bad)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:20px}
  .stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;display:flex;align-items:center;gap:16px}
  .stat .v{font-size:var(--fs-num);font-weight:700;line-height:1}
  .stat .k{font-size:var(--fs-meta);color:var(--muted);margin-top:5px}

  .lrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .lrow.sel{background:var(--soft);border-radius:10px;box-shadow:inset 3px 0 0 var(--primary);padding-left:12px;padding-right:12px;border-bottom-color:transparent}
  .lrow:last-child{border:none;padding-bottom:0}
  .lrow:first-child{padding-top:0}
  .lrow .nm{font-weight:600}
  .lrow .mt{font-size:var(--fs-meta);color:var(--muted);margin-top:1px}
  .time{font-weight:600;color:var(--primary);white-space:nowrap}

  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:var(--fs-meta);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:0 12px 14px}
  .tbl td{padding:15px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:var(--fs-body)}
  .tbl td.nm{color:var(--ink);font-weight:600}
  .tbl tr[data-goto]{cursor:pointer}
  .tbl tr[data-goto]:hover td{background:var(--soft)}

  .tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}
  .tabs button{padding:0 1px 14px;font-weight:600;color:var(--muted);position:relative}
  .tabs button.active{color:var(--ink)}
  .tabs button.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary)}

  .clscard{border-radius:var(--r-sm);padding:18px 20px;cursor:pointer;transition:.15s;border:1px solid var(--line)}
  .clscard:hover{box-shadow:0 6px 18px rgba(20,40,92,.08);border-color:transparent;transform:translateY(-2px)}
  .clscard .cc-top{display:flex;align-items:center;gap:13px}
  .clscard .cc-h{flex:1;min-width:0}
  .clscard .cc-nm{font-weight:600}
  .clscard .cc-badge{display:inline-block;font-size:9.5px;font-weight:700;color:var(--chip-sky-i);background:var(--chip-sky);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;letter-spacing:.3px}
  .clscard .cc-sub{font-size:var(--fs-meta);color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .clscard .cc-arr{color:var(--primary);display:flex;flex:none}
  .clscard .cc-arr svg{width:16px;height:16px}
  .clscard .cc-att{margin-top:16px}
  .clscard .cc-att-h{display:flex;justify-content:space-between;font-size:var(--fs-meta);color:var(--muted);margin-bottom:6px}
  .clscard .cc-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
  .clscard .cc-bar i{display:block;height:100%;border-radius:99px}
  .clscard .cc-foot{display:flex;gap:20px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line);font-size:var(--fs-meta);color:var(--muted)}
  .clscard .cc-foot span{display:inline-flex;align-items:center;gap:6px}
  .clscard .cc-foot svg{width:14px;height:14px}
  .clscard .cc-foot b{color:var(--ink);font-weight:700}

  .seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px}
  .seg button{padding:7px 15px;border-radius:8px;font-weight:600;color:var(--muted)}
  .seg button.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:var(--fs-meta);color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--soft);color:var(--ink);font-size:var(--fs-body)}
  .field textarea{resize:vertical;min-height:84px;line-height:1.55}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);background:var(--card)}
  .rowf{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  .profhead{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .ph-id{display:flex;align-items:center;gap:18px}
  .ph-ava{position:relative;display:inline-grid}
  .ph-dot{position:absolute;bottom:3px;right:3px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:2.5px solid var(--card)}
  .prog-badge{background:var(--chip-sky);border-radius:14px;padding:15px 22px;min-width:200px}
  .prog-badge .pb-t{font-weight:700;color:var(--ink)}
  .prog-badge .pb-s{font-size:var(--fs-meta);color:var(--muted);margin-top:3px}
  .seccard{border:1px solid var(--line);border-radius:var(--r-sm);padding:18px 20px;background:var(--soft)}
  .sec-h{font-weight:600;margin-bottom:15px}
  .pkv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px 18px}
  .pkv .k{font-size:var(--fs-meta);color:var(--muted)}
  .pkv .v{font-weight:600;margin-top:4px;overflow-wrap:anywhere}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .kv .k{font-size:var(--fs-meta);color:var(--muted)}
  .kv .v{font-weight:600;margin-top:3px}

  .ava{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-weight:600}
  .ava.lg{width:52px;height:52px;font-size:15px}

  .search{position:relative}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
  .search input{width:100%;padding:11px 13px 11px 38px;border:1px solid var(--line);border-radius:11px;background:var(--soft);color:var(--ink);font-size:var(--fs-body)}
  .search input:focus{outline:none;border-color:var(--primary);background:var(--card)}

  .acc{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px}
  .acc:last-child{margin:0}
  .acc-h{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
  .acc-h .t{font-weight:600}
  .acc-h .cnt{margin-left:auto;font-size:var(--fs-meta);color:var(--muted);margin-right:12px}
  .acc-h svg.cv{width:18px;height:18px;color:var(--faint);transition:.2s;flex:none}
  .acc.open svg.cv{transform:rotate(180deg)}
  .acc-b{display:none;padding:2px 18px 12px}
  .acc.open .acc-b{display:block}

  .qrow{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line)}
  .qrow:last-child{border:none}
  .qrow .qt{flex:1;font-weight:500;min-width:0}
  .qrow .qn{color:var(--muted);font-weight:700;width:22px;flex:none}

  .cal{width:100%;border-collapse:collapse;table-layout:fixed;min-width:720px}
  .cal th{font-size:var(--fs-meta);color:var(--muted);font-weight:600;padding:10px 8px;text-align:left}
  .cal td{height:92px;vertical-align:top;border:1px solid var(--line);padding:7px;font-size:var(--fs-meta)}
  .cal td .dn{color:var(--faint);font-weight:600}
  .cal td.today{background:var(--chip-sky)}
  .cal td.today .dn{color:var(--primary)}
  .cal td.out{opacity:.35}
  .cal .cev{font-size:9.5px;font-weight:600;border-radius:5px;padding:3px 6px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--chip-green);color:var(--chip-green-i)}

  .evc{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;transition:.15s}
  .evc:hover{box-shadow:var(--shadow)}
  .evc .img{height:96px;background-size:cover;display:grid;place-items:center;color:#fff;font-weight:700;font-size:26px}
  .evc .body{padding:16px 18px}
  .evc .dt{font-size:var(--fs-meta);color:var(--primary);font-weight:600}
  .evc .nm{font-weight:600;margin-top:4px}
  .evc .ds{font-size:var(--fs-meta);color:var(--muted);margin-top:6px;line-height:1.5}

  .warnbox{background:var(--warn-bg);border-radius:var(--r);padding:16px 20px;display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
  .warnbox svg{width:22px;height:22px;color:var(--warn);flex:none;margin-top:1px}
  .warnbox .wt{font-weight:700;color:var(--warn)}
  .warnbox .wm{color:var(--warn);opacity:.92;margin-top:3px;font-size:var(--fs-meta);line-height:1.55}
  .warnbox .wm b{opacity:1}
  .infobox{background:var(--chip-sky);border-radius:var(--r);padding:14px 18px;display:flex;gap:13px;align-items:flex-start;margin-bottom:20px}
  .infobox svg{width:19px;height:19px;color:var(--chip-sky-i);flex:none;margin-top:1px}
  .infobox .im{color:var(--chip-sky-i);font-size:var(--fs-meta);line-height:1.55}

  .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--faint);flex:none;display:grid;place-items:center;cursor:pointer}
  .ck.on{background:var(--primary);border-color:var(--primary)}
  .ck svg{width:12px;height:12px;color:#fff;opacity:0}
  .ck.on svg{opacity:1}

  .star{display:inline-flex;gap:3px;cursor:pointer}
  .star svg{width:16px;height:16px;color:var(--faint)}
  .star svg.on{color:var(--warn);fill:var(--warn)}

  .donut{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
  .donut::before{content:"";width:78px;height:78px;border-radius:50%;background:var(--card);position:absolute}
  .donut .dv{position:relative;text-align:center}
  .donut .dv b{font-size:19px;font-weight:700;display:block;line-height:1}
  .donut .dv small{font-size:9.5px;color:var(--muted)}

  .modal{position:fixed;inset:0;background:rgba(20,40,92,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
  .modal.show{display:flex}
  .mbox{background:var(--card);border-radius:var(--r);box-shadow:0 20px 55px rgba(0,0,0,.28);max-width:480px;width:100%;padding:26px 28px;animation:pop .18s ease;max-height:90vh;overflow:auto}
  .mbox.wide{max-width:600px}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .micon{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:16px}
  .micon svg{width:22px;height:22px}
  .mtitle{font-size:var(--fs-sec);font-weight:700}
  .mmsg{color:var(--muted);margin-top:9px;line-height:1.6}
  .mmsg b{color:var(--ink)}
  .mbtns{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}

  .view{display:none}
  .view.active{display:block;animation:f .2s ease}
  @keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .scroll-x{overflow-x:auto}

  .cc-group{margin-bottom:22px}
  .cc-group:last-child{margin-bottom:0}
  .cc-group-h{display:flex;align-items:center;gap:9px;font-size:var(--fs-meta);font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .cc-group-h span{background:var(--chip-sky);color:var(--chip-sky-i);border-radius:999px;padding:1px 8px;font-size:10px;letter-spacing:0}

  @media (max-width:1000px){
    .app{grid-template-columns:1fr}
    .sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:14px}
    .profile{flex-direction:row;padding:0;gap:10px}.avatar{width:40px;height:40px;margin:0}
    .nav{flex-direction:row;flex-wrap:wrap}.nav a span{display:none}.logout{margin:0}
    .nav .parent{display:none}.nav .sub{display:flex!important;flex-direction:row;flex-wrap:wrap;margin:0}.nav .sub a{padding-left:14px}
    .g2,.g2e,.g3,.g4,.stats,.kv,.rowf{grid-template-columns:1fr}
  }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="profile">
      <div class="avatar" data-goto="profile" title="My profile" style="cursor:pointer"><img alt="" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23C4D8EE'/><circle cx='50' cy='38' r='19' fill='%23375073'/><path d='M16 98c3-23 20-33 34-33s31 10 34 33z' fill='%232B3A55'/></svg>"></div>
      <div><div class="nm">Mateen Shaikh</div><div class="id">Welder Faculty · ID 6788</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><h2 id="pg-title">Dashboard</h2><div class="crumb" id="pg-crumb"></div></div>
      <div class="top-actions">
        <div class="brand"><span class="lt">L&amp;T CTT</span><span class="sub">SKILLING LMS</span></div>
      </div>
    </div>
    <div id="views"></div>
  </main>
</div>
<div id="modal" class="modal"></div>

<script>
const ICONS={
  grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',

function renderContentItems(items){

  const order=[...MODULES.filter(m=>groups[m]),...Object.keys(groups).filter(k=>!MODULES.includes(k))];
  return order.map(mod=>'<div class="cc-group"><div class="cc-group-h">'+mod+'<span>'+groups[mod].length+'</span></div>'+

  document.querySelectorAll('#nav .parent').forEach(p=>{
    const hasActive=[...p.nextElementSibling.querySelectorAll('a')].some(a=>a.classList.contains('active'));
    if(hasActive)p.classList.add('open');
  });
  document.getElementById('pg-title').textContent=(T[id]||['',''])[0];
  document.getElementById('pg-crumb').textContent=(T[id]||['',''])[1];
  if(id==='timetable')cal();
  if(id==='testnew')renderTestQ();
  if(id==='formnew')renderFormQ();
  if(id==='attend'){ATTCOURSE='';ATTDATE='';renderAttHist();}
  scrollTo(0,0);
}

/* ---------- TEST BUILDER ---------- */
function renderTestQ(){
  const list=document.getElementById('tq-list');if(!list)return;
  if(!TESTQ.length){list.innerHTML='<div class="muted" style="padding:18px 0;text-align:center">No questions yet — use <b>Add from bank</b> to pull existing questions, or <b>New question</b> to write one.</div>';}
  else{list.innerHTML=TESTQ.map((q,i)=>'<div class="qrow"><span class="qn">'+(i+1)+'.</span><span class="qt">'+q.q+'</span><span class="pill p-info">'+q.type+'</span><b style="color:var(--primary);width:60px;text-align:right">'+q.marks+' Mk</b><button class="btn btn-o btn-sm" data-tq-edit="'+i+'" style="margin-left:12px" title="Edit">'+ic('edit')+'</button><button class="btn btn-d btn-sm" data-tq-del="'+i+'" title="Remove">'+ic('x')+'</button></div>').join('');}
  const c=document.getElementById('tq-count');if(c)c.textContent=TESTQ.length?'('+TESTQ.length+')':'';
  const t=document.getElementById('tq-total');if(t)t.textContent=TESTQ.reduce((s,q)=>s+(q.marks||0),0);
}
function openBankModal(){
  openModal('<div class="mbox wide"><div class="head"><h3 style="font-size:var(--fs-sec)">Add from question bank</h3><button class="btn btn-o btn-sm" data-mclose>'+ic('x')+'</button></div>'+
    '<div style="max-height:52vh;overflow:auto;margin-bottom:6px">'+QUESTIONS.map((q,i)=>'<label class="qrow" data-bankrow style="cursor:pointer"><span class="ck" data-qi="'+i+'">'+ic('tick')+'</span><span class="qt">'+q.q+'</span><span class="pill p-info">'+q.type+'</span><b style="color:var(--primary);width:52px;text-align:right">'+q.marks+'</b></label>').join('')+'</div>'+

  const ck=e.target.closest('[data-check]');if(ck){ck.classList.toggle('on');return;}

  const rst=e.target.closest('[data-rate] svg');if(rst){const wrap=rst.closest('[data-rate]');const p=wrap.dataset.rate.split('-');const ti=+p[0],ri=+p[1];const idx=[...wrap.children].indexOf(rst);const tp=TOPICS[ti];if(tp&&tp.replies[ri]){const rep=tp.replies[ri];const was=rep.rating;rep.rating=idx+1;render('forum');const el=document.getElementById('tresp');if(el)el.scrollIntoView({block:'start'});if(!was)toast('c-green','check','Reply rated','Scored '+rep.nm+"'s reply "+(idx+1)+'/5. It now logs against their record.');}return;}
  const st=e.target.closest('[data-stars] svg');if(st){const wrap=st.closest('[data-stars]');const kids=[...wrap.children];const idx=kids.indexOf(st);kids.forEach((k,i)=>k.classList.toggle('on',i<=idx));const lbl=wrap.parentElement.querySelector('.muted');if(lbl&&/Merit/.test(lbl.textContent))lbl.textContent='Merit '+(idx+1)+'/5';return;}
});

/* assessment course filter */
document.addEventListener('change',e=>{
  const tf=e.target.closest('[data-testfilter]');
  if(tf){TESTFILTER=tf.value;const cb=document.getElementById('tests-create');if(cb)cb.dataset.course=TESTFILTER;renderTests();return;}
  const ac=e.target.closest('[data-attcourse]');if(ac){ATTCOURSE=ac.value;renderAttHist();return;}
  const ad=e.target.closest('[data-attdate]');if(ad){ATTDATE=ad.value;renderAttHist();return;}
});
/* live search */
document.addEventListener('input',e=>{
  const s=e.target.closest('[data-search]');if(!s)return;
  const q=s.value.toLowerCase();const scope=s.closest('.card');
  const tbl=scope.querySelector('[data-searchtable]');if(!tbl)return;
  tbl.querySelectorAll('tbody tr, [data-row]').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';});
});

/* ---------- CALENDAR ---------- */
function cal(){
  const b=document.getElementById('cal');if(!b)return;const first=3,dim=31;let d=1-first;
  let h='<thead><tr>'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
  for(let w=0;w<6;w++){h+='<tr>';for(let i=0;i<7;i++){
    if(d<1||d>dim){h+='<td class="out"><span class="dn">'+(d<1?30+d:d-dim)+'</span></td>';}
    else{const ev=(i>=1&&i<=6)?'<div class="cev">Welder — Lecture</div>':'';h+='<td class="'+(d===23?'today':'')+'"><span class="dn">'+d+'</span>'+ev+'</td>';}
    d++;}h+='</tr>';if(d>dim)break;}
  b.innerHTML=h+'</tbody>';
}

/* light theme only */
document.documentElement.setAttribute('data-theme','light');
render('home');
</script>
